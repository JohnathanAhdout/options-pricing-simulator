[project]
name = "optionspricer"
version = "0.1.0"
description = "An options pricing and volatility-trading research toolkit: pluggable pricing engines, implied-vol solvers, and P&L-attribution experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optionspricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
